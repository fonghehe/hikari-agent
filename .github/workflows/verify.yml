name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 26.04 adds a conflicting bwrap-userns-restrict AppArmor profile.
        # Upgrade the sandbox setup explicitly before moving this baseline.
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap xvfb ripgrep apparmor
      - name: Allow bubblewrap user namespaces on Ubuntu
        if: runner.os == 'Linux'
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo apparmor_parser -r scripts/ci/bwrap.apparmor
          fi
      - name: Verify bubblewrap can isolate a process
        if: runner.os == 'Linux'
        run: bwrap --unshare-all --ro-bind / / -- /bin/true
      - if: runner.os == 'macOS'
        run: command -v rg || brew install ripgrep
      - if: runner.os == 'Windows'
        run: if (!(Get-Command rg -ErrorAction SilentlyContinue)) { choco install ripgrep --yes --no-progress }
      - run: rg --version
      - run: pnpm --filter @hikari/desktop exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm docs:build
      - run: pnpm test:cli
      - run: pnpm exec playwright test
        if: runner.os != 'Linux'
      - run: xvfb-run -a pnpm exec playwright test
        if: runner.os == 'Linux'
      - run: pnpm desktop:pack
      - name: Allow packaged Chromium user namespaces on Ubuntu
        if: runner.os == 'Linux'
        run: bash scripts/ci/allow-desktop-userns.sh
      - name: Verify packaged desktop
        if: runner.os != 'Linux'
        run: pnpm test:package
      - name: Verify packaged desktop under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:package
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failure-${{ matrix.os }}
          path: |
            .artifacts/test-results
            .artifacts/playwright-report
          include-hidden-files: true
          retention-days: 7
